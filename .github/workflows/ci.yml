name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip pipenv
          PIPENV_VENV_IN_PROJECT=1 pipenv sync --dev

      - name: Lint backend
        working-directory: api
        run: |
          # Ruff 0.16 enables a large new rule set by default. Keep CI on the
          # established project baseline until that migration is deliberate.
          pipenv run python -m pip install "ruff==0.15.20"
          PIPENV_VENV_IN_PROJECT=1 pipenv run ruff check .

      - name: Check backend editor diagnostics
        run: npx --yes pyright@1.1.408 --project pyrightconfig.json

      - name: Type-check backend
        working-directory: api
        run: PIPENV_VENV_IN_PROJECT=1 pipenv run mypy .

      - name: Test backend
        working-directory: api
        run: PIPENV_VENV_IN_PROJECT=1 pipenv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web_app/yarn.lock

      - name: Test and build frontend
        working-directory: web_app
        env:
          VITE_API_URL: /api/v1
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn test
          yarn build
          yarn test:prod-api-url
