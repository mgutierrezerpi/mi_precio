# Temporary HTTP-only virtual host used to obtain the first Let's Encrypt
# certificate. Replace it with bugsink.miprecio.app.nginx.conf immediately after
# certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name bugsink.miprecio.app;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
